## Footnotes

footnote_1: >
  For those reading this article in print, the performance here, as well as all other video and audio examples referenced throughout the article, can be found on my website: https://www.issaaji.com. This particular performance serves as the basis for my analysis of the song's rhythmic-temporal disruptions, specifically the one occurring at 0:25.
footnote_2: >
  Following Hasty (1997), I describe listeners' embodied experience of meter and rhythm as a form of engaging with music's temporal unfolding. For more on the body's engagement with musical time, see also Kozak (2020).
footnote_3: >
  De Souza's (2017, 89) use of the terms "consistency" and "displacement" originates with Straus (2003). As it applies to voice leading, consistency measures general uniformity, counting the number of voices moving by the same interval (Straus 2003, 315). Displacement, by contrast, measures the total number of semitones traversed (ibid., 320). My application of the terms is described below.
footnote_4: >
  Scholars adhering to this view tend to follow a version of the intellectual tradition put forth by affect theory, where emotions are seen as rigid linguistic fixings of affect's immediate, corporeal, and asignifying "intensities," which cannot be adequately captured with the tools of language. According to Brian Massumi (2002, 61), who is arguably the most influential affect theorist today, emotions are "a contamination of empirical space by affect, which belongs to the body without an image." For insightful critiques of affect theory and its sharp bifurcation of emotion and affect, see Leys (2011), Brinkema (2014), Garcia (2020), and Grant (2020).
footnote_5: >
  For a systematic account of this process within the context of *ṭarab*, see Racy's discussion of the "ecstatic feedback model" (1991).
footnote_6: >
  My understanding of the participatory dynamics of *ṭarab* performance is informed by Thomas Turino's (2008, 28) conception of participation, the "sense of actively contributing to the sound and motion of a musical event through dancing, singing, clapping, and playing musical instruments when each of these activities is considered integral to the performance."
footnote_7: >
  This framework generally applies to all percussion instruments comprising a given percussion section within a particular performance setting. In the case of the NAO's performance of "Alf Leila wi Leila," the percussion section consists of two *ṭablah-s* (a vase-shaped single-headed drum), a *riqq* (a small, handheld tambourine), a set of bongos, and a *katim* (a large frame drum). For an image of these instruments, refer to 0:13 in the video above.
footnote_8: >
  To hear each *īqāʿ* shown in Example 2 in isolation, refer to the website cited in note 1.
footnote_9: >
  When the transliteration of Arabic nouns in their plural or possessive forms prove unnecessary or awkward, I use the English ending "-s" to end the word (e.g., *Bambi-s* and *ṭablah-s*).
footnote_10: >
  For a related discussion on tempo changes (specifically, tempo escalation) in Sufi music of North India and Pakistan, see Qureshi (1986, 204--5).
footnote_11: >
  Reading the *Maqsum* as more symmetrical than the *Bambi* relies, of course, on where one draws their axis of symmetry. My interpretation is based on the meaning of the Arabic word *maqsum* (meaning "divided" or "distributed"), which refers to the rhythm's simple division into two halves (see the vertical line connecting the two *dumm* beats at pulse numbers 0 and 8 in Example 6). For more on the *Maqsum-s* symmetrical division, see Farraj and Abu Shumays (2019, 107--8).
footnote_12: >
  Examples of rhythmic-temporal disruptions are widespread throughout the *ṭarab* repertoire. Some notable examples include the NAO's rendition of Umm Kulthūm's "Ghanni li Shwayya Shwayya" (2:52), ʿAbd al-Ḥalīm Ḥāfiẓ's "Zayy il-Hawa" (1:49), Ṣabāḥ Fakhrī's "Yā Māl al-Shām" (3:20), and Sayyid Darwīsh's "Yā Bahjat al-Rūh" (0:30). These performances can be found on the website cited in note 1. Timestamps apply only to those specific recordings, which are also referenced in the "Works Cited" list.

