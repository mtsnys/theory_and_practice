## Footnotes

footnote_1: >
  Lehman (2024) discusses the field's history and development in the book's foreword, while the broader edited volume features theoretical approaches around analytical parameters drawn from the discipline's current discourse: timbre, tempo, pitch design, theme, meter, form, key, thematic transformation, post-tonality, serialism, and underscore.

footnote_2: >
  In addition to numerous presentations and publications in other scholarly venues, each of the Society for Music Theory's flagship journals (*Music Theory Spectrum*, *Music Theory Online*, and *SMT-V*) has published at least one article on film music during the last three years.

footnote_3: >
  Motazedian (2016, 2) summarizes this account with a quote from Lehman (2012, 9): "Analysis of pitch-design in film scores has been something of a taboo subject for many theorists; this is due to presumptions about tonal memory, composer-intention, and the coherence of film scores as 'works.'" Lehman's discussion attributes this state of affairs in part to "Hans Keller's \[2006\] insistence on cohesive key relationships across cues" and "Adorno and Eisler's \[1947/2007\] contention that such relationships run contrary to the extra-musical demands of the medium."

footnote_4: >
  Examples include Murphy (2006) and Lehman (2013). Additionally, Blim (2013) incorporates non-functional key relationships and associative tonal motion in discussion of musical and dramatic design in Bernard Herrmann's prelude to *Vertigo* (1958), and Yorgason and Lyon (2020) examine non-functional and dissonant resolutions in Max Steiner's Warner Bros. fanfares.

footnote_5: >
  For a full explication of drastic versus gnostic epistemologies, see Abbate (2004).

footnote_6: >
  For more background on directional and progressive tonality, see Kinderman and Krebs (1996).

footnote_7: >
  Lehman frames this hazard as a result of "the propensity of teleological thinking to treat music as if it were proposing and realizing future events \[as\] a natural method of introducing a dynamic, chronology-dependent component to music analysis." He goes on, "It is all too easy, however, to assert the operation of some long-range teleological plan by assuming that significant events late in the score are necessarily a 'goal,' and extracting a cumulative musical narrative out of previous material to generate that goal. Such a question-begging approach is especially inappropriate in film music, where the temptation to inflate the importance of foregrounded, climactic cues is strong." His resultant requirements for such teloses include "ample foreshadowing of the eventual telos. This is achieved through repeated references or allusions to the goal-key, or by means of a clear and smoothly running musical process (such as a harmonic cycle or robust monotonal framework) to generate it" (2012, 92).

footnote_8: >
  See Buhler, Neumeyer, and Deemer (2010) for a thorough discussion of sound effects in film music analysis.

footnote_9: >
  Lehman (2012, 112) discusses monotonal examples, including *The Red Violin* (1998), within a taxonomy of two pairs: monotonal and non-monotonal, and keys that signify absolutely versus keys that signify through interactions and processes.

footnote_10: >
  The companion website can be accessed at <https://www.motazedian.net/keyconstellations>.

