## Footnotes

footnote_1: >
  This idea of a double consciousness involving positive and negative selves may be familiar from the scenario of "Der Doppelgänger" (D. 957, no. 13), which Rusch cites as a well-known example of the use of Romantic irony in Schubert's songs, especially in his settings of texts by Heinrich Heine (29).

footnote_2: >
  This contrasts with Cohn's (2012, 2) argument that if the local keys do not work together to express the global tonic of B-flat major in a diatonic reading, "we just have a bunch of tubs floating around on their own bottoms."

footnote_3: >
  Rusch draws here on Tovey's (1928, 351) idea that "the most fundamental rule for operations in large-scale tonality is that key-relation is a function of form."

footnote_4: >
  I am reminded of Marion Guck's (2006, 197) remark that "\[a\]nalyses necessarily bear the traces of the personal sensibilities, experiences, and inclinations of their authors, or their public personae." Rusch cites Guck's article (but not this specific quote) in chapter 5.

footnote_5: >
  The preponderance of piano music can be illustrated by the fact that 56 of the 62 musical examples in the book deal with solo piano music. One could very reasonably argue that the book's title should refer to "Schubert's piano music" rather than "Schubert's instrumental music."

footnote_6: >
  Fisk was referring specifically to a passage towards the end of the development section in the first movement of the Piano Sonata, D. 960, where the B-flat major tonic is recovered, "at first chimerical\[ly\]," following a prolonged passage in D minor (302).

