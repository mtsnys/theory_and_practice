## Footnotes

footnote_1: >
  The website of the Centre for the History and Analysis of Recorded Music (CHARM), a project funded by the United Kingdom's Arts and Humanities Research Council from 2004--2009, serves as an excellent introduction to some of the methods and objects of study common to classical recording studies (<https://charm.rhul.ac.uk/index.html>).

footnote_2: >
  The companion website can be accessed at [www.oup.com/us/SoundsasTheyAre](http://www.oup.com/us/SoundsasTheyAre).

footnote_3: >
  In an early footnote, Beaudoin lists all the musicians, ensembles, composers, and record labels represented in his graphic music examples (9--10n2). Recording dates span 1889--2023; score composition dates span 1720--2020; ensembles range from solo instruments to full orchestra to voice and piano. By acknowledging the complex webs of people and materials that participate in the creation of recordings, Beaudoin recalls Vivian Luong's (2017, \[3.14\]) notion of music analysis as a practice that involves "not only the theorist-and-the music dyad, but also other human and nonhuman bodies---our peers, students, theoretical apparatuses, papers, pencils, and laptops."

footnote_4: >
  Although Chapter 4 introduces some idiosyncratic annotation tools first introduced in Chapters 2 and 3, these tools are fairly intuitive to understand.

footnote_5: >
  Beaudoin invokes Schoenberg's (1978, 309) notion of "everything that sounds simultaneously" and Suzannah Clark's (2019, 148) notion of notes having "equal rights." Although both Schoenberg and Clark are discussing pitch-based parameters, Beaudoin views his project as a conceptual extension of their ideas.

footnote_6: >
  These examples include an unwritten note in Pablo Casals's 1936 recording of the Sarabande from J. S. Bach's Cello Suite in D minor, BWV 1008, pervasive clicking noises in George Walker's 2005 recording of Fryderyk Chopin's Étude in G-flat major, Op. 10, No. 5, and abundant breaths in Kim Kashkashian's 2018 recording of the Gigue from Bach's Cello Suite in C minor, BWV 1011.

footnote_7: >
  From "the archive of reviews published in *Gramophone* magazine extending back to January 1983" (43), Beaudoin selects ten representative examples. As an example, Roger Nichols's (2000, 57) review of conductor Yutaka Sado's recording, with the Lamoureux Orchestra, of music by Emmanuel Chabrier, reads, "If he is to make any more recordings he should be encouraged not to grunt audibly at moments of stress: the opening of the *Gwendoline* Overture is only one of several passages thus marred" (43).

footnote_8: >
  For example, Robert Cowan's (1999, 105) review of Arturo Toscanini's BBC Legends recording with the BBC Symphony Orchestra reads, "Toscanini's audible singing (you hear it throughout the set) is further proof of his ecstatic involvement" (45).

footnote_9: >
  Throughout the chapter, Beaudoin draws on work by pragmatist philosophers William James, Charles Sanders Peirce, John Dewey, Richard Rorty, and Cornell West (230).

footnote_10: >
  I highly recommend accepting Beaudoin's invitation to "audit the complete track" (85n15), as the expressive import of Burton's breaths is most powerful in their full context.

footnote_11: >
  Beaudoin's frequent connections between unwritten sounds and musical expression at multiple levels resonate with Daphne Leong's (2019, 8--10) expansive view of musical structure. In particular, unwritten sounds might qualify as either "perceived" or "performed" elements of structure.

footnote_12: >
  The examples: cellist Giambattista Valdettaro's strikingly intense "thoroughgoing growl" that corresponds with motivic elements throughout his 2014 recording of Zoltán Kodály's Sonata for Solo Cello; conductor Georg Solti's audible moans of varying placement and quality that correspond with phrasing in his 1984 recording of Gustav Mahler's 4<sup>th</sup> symphony; and pained sounds of pianist Joyce Hatto that her husband William Barrington-Coupe subsequently (and infamously) "patched over."

footnote_13: >
  Critic Jed Distler's review of Fazıl Say's 2001 recording of Franz Liszt's Piano Sonata in B minor is exemplary. Distler writes of Say, "He impatiently plows through the tender D major theme as if its overt lyricism were a source of embarrassment and drops a beat each time before he launches into the exposition's infamous octave section. What's more, his characteristic moans and groans now exceed the official porno movie limit" (138).

footnote_14: >
  The "sit-see" of the damper pedal is difficult to make out; it features only briefly in Beaudoin's analysis.

footnote_15: >
  Harkening back to the analogies of Chapter 1, Beaudoin compares listening *with*---rather than *through*---surface noise to the lines drawn on a piece of paper when using a seventeenth-century device (*tabula*) for creating a perspective drawing (*carta*) (185--87).

footnote_16: >
  Beaudoin calls these modes "narrative asynchrony," "ekphrastic (non)coincidence," "expressive synchrony," and "metaphoric development" (188--89).

footnote_17: >
  Although Beaudoin provides an annotated score for the entire movement, Audio Example 3.5 includes only the first thirty seconds of Nelsova's recording. The entire track is easily accessible on Spotify or YouTube (https://www.youtube.com/watch?v=CjQiW0fxeJM).

footnote_18: >
  Beaudoin provides few details of his own listening conditions beyond indicating that almost all spectrograms in the book are drawn from compact disc audio files (10).

footnote_19: >
  Beaudoin's post-tonal examples include Edgard Varèse's *Density 21.5*, Arnold Schoenberg's op. 19, no. 1, Liza Lim's *Sex Magic*, and Zoltàn Kodály's Sonata for Solo Cello, op. 8. Several tonal composers---J. S. Bach, Ludwig van Beethoven, Gustav Mahler, and Fryderyk Chopin among them---are each represented in multiple analyses.

footnote_20: >
  Beaudoin briefly mentions several post-1945 works that include notated grunts, including Toru Takemitsu's *Voice* for solo flute (1971), Julius Eastman's *Femenine* (1974), and Olga Neuwirth's opera *Lost Highway* (2002--2003), among others (135--36). However, the only recording he analyzes that includes notated sounds of effort alongside non-notated ones is Claire Chase's 2023 recording of Liza Lim's 2020 *Sex Magic*.

footnote_21: >
  Mitch Ohriner's (2023) conference paper on the syntactic and expressive function of inhales in Taylor Swift's recent album *Midnights* is illustrative.

footnote_22: >
  Beaudoin writes, "I leave analyses of \[audience\] coughs (as well as page-turns, ring tones, and airplanes flying over recording studios) to others" (10).

footnote_23: >
  Beaudoin makes his spectrograms using the Lucerne Audio Recording Analyzer (LARA) (10); many readers may be more familiar with Sonic Visualiser (available for free download at <https://www.sonicvisualiser.org/index.html>).

