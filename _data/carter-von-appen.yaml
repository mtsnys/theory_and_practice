    - figure:
        number: '31'
        caption: >
          The 13 Rolling Stones songs on which Charlie Watts played with the highest tempo CV measurements found for the band. Songs with substantial passages without drums or percussion are in gray on the list.
        url: 'assets/articles/carter-von-appen/img/ex_31.png'
        alt: 'Test'
        border: false
        scale: 1
