## Footnotes

marginnote_1: >
  We are grateful for the work of our research assistants Mira Perusich, Jonas Kastenhuber, Alexis Cantelme, and Monserrat Torres Guillen, as well as for the feedback of Trevor de Clercq and the anonymous peer reviewers.
footnote_1: >
  MrMonte (Monte Mallin), reply to "Musicians: How Do You Explain Charlie's Technique to Drummers?," *It's Only Rock'n Roll* forum, March 9, 2012, <https://iorr.org/talk/read.php?1,1579013,page=1>.
footnote_2: >
  See <https://www.izotope.com/> and <http://moises.ai.> We initially used iZotope RX 9's Music Rebalance tool to isolate the drums, but subsequently found that Moises could do the same job more efficiently, so we switched tools early in the study. Moises, built using a Python library called Spleeter, derives time-frequency masks using machine learning in order to perform source separation (Hennequin et al. 2020; Pang 2019).
footnote_3: >
  See <https://www.sonicvisualiser.org/> and <https://www.vamp-plugins.org/download.html>. In the BBC Rhythm: Onsets plugin, we used a Hann window shape, an FFT window size of 128 samples, and a window increment of 32. These settings allowed for a time resolution of 0.7 milliseconds. We started with a threshold setting of 3 and then increased or decreased it to automatically mark the quarter notes. In cases where the algorithm did not detect an attack that actually occurred, we lowered the threshold in a second layer and copied the resulting markers into the first layer. See Baume (2013) for a description of the plugin.
footnote_4: >
  Danielsen and others have discussed how there is not always a visual point in the representation of a waveform that will consistently align with human perception of the moment of attack---this is variable between instruments and versions of the same instrument (see also Hellmer and Madison 2015, 150). Identifying the moment of attack is easier with percussive attacks like drums, yet there is still no single timepoint that can be objectively identified. Identifying the moment of attack can also be complicated when there are near-simultaneous hits on multiple instruments within a drum kit (Hove et al. 2007; see also Câmara 2021, 35--41). The separation software we used did not allow for automatic separation of the hi-hats from the snare and kick; in the occasional instances when the onset detection plugin created two markers for a single beat, we analyzed only the broader-spectrum snare attack.
footnote_5: >
  Eighth notes on the hi-hat are a fundamental component of the standard rock backbeat pattern, but comments on Watts's drumming have tended to focus on the presence or absence of delay or anticipation of the backbeats and the kick drum rather than the hi-hat eighths. Additionally, Watts typically did not play the hi-hat on beats two and four (see footnote 19, below). Given that some blues-influenced Rolling Stones songs employed swing, potential future research could examine Watts's use of swung eighths on the hi-hat or ride cymbal.
footnote_6: >
  We input data from all quarter-note attacks, even if there was a brief departure from the usual pattern of kick on beats 1 and 3 and snare on beats 2 and 4. For instance, if there was a bar in which the snare or hi-hat, but not the kick, played on beat 1, we would still encode that beat. If no attack occurred on a beat, we did not insert a marker; there would just be a gap in our table. We avoided analyzing songs or parts of songs without a fairly steady stream of quarter-note attacks, so there were rarely a large number of gaps in the passages we analyzed.
footnote_7: >
  For this reason, many microtiming studies, such as Kilchenmann and Senn (2015), have drummers record to a click track when creating recordings for analysis.
footnote_8: >
  More recent musical stimuli have a greater effect on listener expectations than ones further in the past, but scientific estimates differ as to how quickly listeners disregard earlier information (Bailes et al. 2013, 1).
footnote_9: >
  Butterfield evaluates timing based both on the current measure and on the previous measure. Frane, as a secondary method of measurement, uses only the previous *beat* as the basis for determining listener expectation. Hellmer and Madison also use previous attacks to predict future ones but rely on the BeatRoot beat tracking system (2015, 152, 154). The BeatRoot system does not examine a fixed past time when making beat predictions, but instead creates initial tempo hypotheses and then reacts to subsequent onset information to adjust the hypotheses (Dixon 2001; Dixon 2007). BeatRoot, however, problematically sometimes snaps beats to actual onsets and often generates beat tracking errors.
footnote_10: >
  If there was no attack on a downbeat, then that bar could not be used as the basis for a "prior bar" calculation, and the subsequent bar would be excluded from analysis.
footnote_11: >
  When asked about playing behind the beat, renowned session drummer John Robinson said that he would keep the bass drum exactly on time but adjust the other attacks around it (Miller 1994, 21--22).
footnote_12: >
  The asymmetric placement of quarter-note attacks within a relatively steady tempo can be compared to swung eighth notes, where the *beat* is steady but there is an unequal division of the beat. As Iyer points out, the timing of the kick and that of the snare are interrelated, such that referring to a microtiming deviation as a late snare or as an early kick "is a matter of perspective" (2002, 407). Relatedly, Danielsen discusses how downbeats are expected to be played slightly early in soul and other genres (2006, Chapter 5). Still, the fact that asymmetric division of the bar is more often described as a "delayed backbeat" than an "early downbeat" reflects how the downbeat serves as a point of reference for most listeners.
footnote_13: >
  Our focus on the drums does not encompass the contributions to rhythmic feel of the other members of the band. Watts was just one part of the band and reacted to the playing of the other musicians. Individual band members can have contrasting microrhythmic feels (Benadon 2006, 82), and it has been theorized that microrhythmic discrepancies between the drums and bass are crucial to groove in jazz (Butterfield 2010, 157--158). We focused on drums in this project for the sake of simplicity and because the precise timing of drum attacks can more reliably be specified than that of bass or guitar attacks.
footnote_14: >
  There was a fairly strong correlation between the mean beat 2 and mean beat 4 deviations in a song; see footnote 17 below.
footnote_15: >
  Madison and Merker's finding (2004, 71) that musicians can react to deviations from isochrony as small as 1.5 milliseconds suggests that discrepancies smaller than 2.5 percent of IOI could change the "feel" of a Stones recording for a listener even if they would not be able to consciously recognize such small deviations.
footnote_16: >
  In most instances, the microtiming analysis we did for a given song is of a subset of the song's entire length. This was in large part to focus on passages where there is a standard rock backbeat pattern or variant and where there were not too many fills or syncopations that would interfere with marking quarter-note attacks. This approach prioritized obtaining samples of more songs over doing analyses of a smaller number of full songs.
footnote_17: >
  Considering the entirety of Watts's career, there was a fairly strong correlation between the average amount of delay of beat 2 in songs and that of beat 4, with *r* = .81 for the 62 Watts studio recordings. The recordings with the most consistent beat 2 delays, however, were not always those with the most consistent beat 4 delays. "Monkey Man" and "Sister Morphine," for instance, showed strong tendencies towards beat 2 delay but not for beat 4, while the reverse was true of "All Down the Line." There was a similar correlation between delay of beat 2 and beat 4 in the 59 analyzed recordings with other drummers, with *r* = .84.
footnote_18: >
  In his 2012 review of "One More Shot," Neil McCormick wrote that Watts's "swinging beat \[was\] just that micro-fraction behind where you might expect it to be."
footnote_19: >
  Stones guitarist Keith Richards has linked the practice of delaying the backbeat to Watts's idiosyncratic habit of not playing the hi-hat when he hits the snare (Richards 2010, 121). Despite Richards's claim, there is little evidence that Watts's habit of not hitting the hi-hat on beats 2 and 4 caused him to play behind the beat. The fact that Watts did not always play behind the beat when using the technique calls into question Richards's contention. Video of the Stones playing "I Got the Blues" ([The](The) Rolling Stones 2022), for instance, clearly shows Watts using this technique, but analysis of this performance reveals that he played the backbeats consistently *early*. Also undermining Richards's theory is the fact that the snare is at times delayed when Watts uses the ride cymbal instead of the hi-hats for eighth-note subdivisions, as in the studio recordings of "Angie" (1:43--1:56) and "No Use in Crying" (0:40--1:00); Watts typically played all eighth-note subdivisions when playing the ride.
footnote_20: >
  The mean standard deviations in these studies ranged between 11 and 19 ms, with smaller standard deviations at faster tempos. The standard deviations in Watts's playing shown in Example 11 tend to be somewhat greater, which is unsurprising given that Watts was not playing with a click track (see section V, below), while the drummers in the Câmara et al. and Danielsen et al. studies were playing with either a metronome or a tempo invariant backing track.
footnote_21: >
  The syncopated kick patterns in "Sister Morphine" and "One More Shot" provide additional examples. While syncopated kick patterns tended to be associated with backbeat delay in our study, songs with simple, unsyncopated kick patterns tended towards early backbeats; see our discussion of early backbeats, below.
footnote_22: >
  This is despite the overall pattern of acceleration in the song (see section IV, below).
footnote_23: >
  Butterfield writes that "competent" drummers tend to "fairly consistently" place their attacks either on top of or behind the beat (2006, 36). Looking at the microtiming of "Monkey Man" and other songs in detail suggests that, while consistent placement behind or ahead of the beat is possible for a drummer playing without mechanical assistance, the *amount* of displacement may be highly variable even with an expert drummer.
footnote_24: >
  In his study of microtiming in famous breakbeats, Frane found significantly more tendency to delay beat 2 than beat 4 (2017, 299), but we did not find this to a statistically significant extent with either Watts or the group of other artists.
footnote_25: >
  "In the Midnight Hour" is famous as a supposed example of a delayed backbeat (Bowman 1995, 308--309; Covach and Flory 2018, 235--236). But the analyses of Smialek (2020) and Hosken (2021) concur with ours that the snare in this recording does *not* have a consistent pattern of delay. One possible reason for the perception of backbeat delay in this track is the playing of the horn section on the backbeats, sounding slightly later than the snare hits.
footnote_26: >
  Watts also delayed backbeats more than other drummers when playing the same song. While Watts's studio version of "Heart of Stone" substantially delays 25 percent of the second beats, beat 2 attacks in the *Metamorphosis* version of the song with substitute drummer Clem Cattini are on average slightly ahead of expectation. The Stones' cover of "I'm a King Bee" substantially delays 50 percent of the second beats, while the original shows no statistically significant tendency towards beat 2 delay. Similarly, covers of Stones songs by Linda Ronstadt ("Tumbling Dice") and Blackberry Smoke ("All Down the Line") do not show the same propensity for delayed backbeats as the originals.
footnote_27: >
  Tempo fluctuations in Watts's drumming occur within the context of the Rolling Stones as a band, so it is necessary to look at the band as a whole in this regard. Because one aspect is individual and the other is collective, one must be cautious in making direct comparisons between analysis of microtiming in Watts's drumming and analysis of the tempo variability of the entire band. We nevertheless present analyses of drum microtiming and tempo variability side by side because they are so closely interrelated and together provide a more complete picture of Watts's drumming.
footnote_28: >
  Polfreman (2013) evaluated the ability of an earlier version of Melodyne to track attack transients, finding that it identified percussive attacks well but showed significant discrepancy from perceptual attack times for bowed sounds (4--5).
footnote_29: >
  In about half of the cases, it was necessary to manually enter the correct time signature, correct "octave" errors if the algorithm misinterpreted the tempo as being half or twice as fast (Schreiber 2020, 29), or make other manual adjustments. While another analyst might end up with slightly different tempo maps, this would not substantially affect the overall shapes described in this section. See footnote 33, below, regarding potential variability in tempo coefficient of variation calculations by different analysts using Melodyne.
footnote_30: >
  Baur discusses the combination of increasing texture and tempo in "Salt of the Earth" (2020, 37--38). We did not find examples where the Stones significantly slowed down over the course of a song. Other artists also speed up much more commonly than they slow down, with accelerating examples including "I'm So Tired" by the Beatles, "Hells Bells" by AC/DC, and "Babies" by Pulp.
footnote_31: >
  Huron has noted the tendency of performers to accelerate as they approach a climactic moment (2006, 326).
footnote_32: >
  We used sets of two bars in order to approximate the window in which a listener perceives tempo. Schreiber points out that there is a lack of scholarly consensus on the timeframe within which tempo perception occurs. His approach is to use a 12-second window (2020, 115--117, 119).
footnote_33: >
  There is potential variability in different analysts' tempo CV calculations, even when our detailed method is followed, particularly in cases of songs with prominent ritardandi and/or caesuras. Analysis of the same tracks by different analysts suggests that analyses of songs with a CV of 1.0 or below will typically be identical or nearly identical, while independent analyses of recordings with tempo CVs greater than 1.0 can differ by up to 10 percent.
footnote_34: >
  Songs in our *Billboard* and non-*Billboard* Others corpora known to have been recorded to a click track typically have CV values ranging between 0.2 and 0.5: for instance, Nirvana\'s "Lithium," 0.20 (Coffman 2023); Sly & the Family Stone's "Family Affair," 0.27 (LeRoy 2023, 32); and Ron Wood\'s "Shirley," 0.39 (LeRoy 2023, 38).
footnote_35: >
  The low tempo CV measurements for the Stones tracks in Example 36 suggest the use of mechanical assistance, despite guitarist Keith Richards's vocal disapproval of the use of "hi-tech stuff" in the studio (Mattingly 1990, 21). For 1997's "Saint of Me," one of three Dust Brothers-produced tracks in Example 36, Watts played over a recording of a Roland TR-808 drum machine (Janovitz 2013, 363--364).

