        caption: >
          Comparison of Rolling Stones tempo variability (overall mean CV = 1.62; songs on which Charlie Watts drummed only) with that of the year-end *Billboard* Top 10 (overall mean CV = 0.90) over time. Comparing the overall means of the two corpora (using a two-sample *t*-test), *p* \< .001.
