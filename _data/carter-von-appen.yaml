app_figure_1:
  main_number: 
  main_caption:    
  figures:
    - figure:
        number: '1'
        caption: >
          Microtiming in 62 Rolling Stones studio recordings, ordered by year of release. The beat 2 and beat 4 "JND Early" and "JND Late" percentages refer to the frequency of deviations of 2.5 percent of the average IOI or larger. "Bt. 2 % of IOI" translates the raw beat 2 delay into a percentage of the mean IOI for the song. The *p*-values for beat deviation means are the result of two-sided one-sample *t*-tests with a null hypothesis of a mean of zero. Red highlighting indicates beat 2 or 4 JND Early or Late percentages of 40 percent or greater; "*n*" refers to the number of second beat attacks analyzed for each song. \*The summary statistics at the bottom of the chart incorporate "Emotional Rescue" as a single song.
        url: 'assets/articles/carter-von-appen/img/app_ex_1.png'
        alt: 'Test'
        border: false
        scale: 1
app_figure_2:
  main_number: 
  main_caption:    
  figures:
    - figure:
        number: '2'
        caption: >
          Microtiming in other drummers (59 recordings), ordered by year of release of recording. The beat 2 and beat 4 "JND Early" and "JND Late" percentages refer to the frequency of deviations of 2.5 percent of the average IOI or larger. "Bt. 2 % of IOI" translates the raw beat 2 delay into a percentage of the mean IOI for the song. The *p*-values for beat deviation means are the result of two-sided one-sample *t*-tests with a null hypothesis of a mean of zero. Red highlighting indicates beat 2 or 4 JND Early or Late percentages of 40 percent or greater; "*n*" refers to the number of second beat attacks analyzed for each song. Three Rolling Stones songs with drummers other than Charlie Watts were also included.
        url: 'assets/articles/carter-von-appen/img/app_ex_2.png'
        alt: 'Test'
        border: false
        scale: 1
app_figure_3:
  main_number: 
  main_caption:    
  figures:
    - figure:
        number: '3'
        caption: >
          The 133 Rolling Stones studio recordings with Charlie Watts that were analyzed for tempo variability, shown with their tempo coefficient of variation (CV). Calculations exclude closing ritardandi, and songs in compound meter were analyzed in 12/8. Red shading indicates a tempo CV of 3.0 or higher, indicating great tempo variability; yellow shading indicates a tempo CV of less than 0.5, suggesting the use of a click track, drum machine, or looped sample. \*"Salt of the Earth" switches to a double-time feel in the outro; the tempo CV was calculated treating that portion as if the tactus had not changed.
        url: 'assets/articles/carter-von-appen/img/app_ex_3.png'
        alt: 'Test'
        border: false
        scale: 1
