## Footnotes

footnote_1: >
  This first became evident to me while writing my master's thesis (Shilton 2017); see Shilton (2019) for the study's conclusions. The subject was the evolution of language, with a focus on the prehistoric site of *Gesher Benot Ya'aqov*. Although the site spans one hundred thousand years of intermittent human settlement and produced a treasure trove of stone tools and animal bones, not a single human bone was recovered.

footnote_2: >
  It is not a totally unconstrained field: accounts of human evolution are grounded in evidence obtained according to the best practices of each related discipline, and they still must meet some acceptable standards. For more on the latter, see Anton Killin's (2017) discussion of "lineage explanations."

footnote_3: >
  To know if something is "superior" to another, one must take it in context, defining specific goals and values. In relation to certain goals and values, a simple design can be superior to a more complex one.

footnote_4: >
  For more on the history of three-stage models since the nineteenth century, see Geroulanos (2024).

footnote_5: >
  To give a better sense of Blackwell's tabulation and some of its peculiarities: for the human species, men exhibit superiority in "sexual love" and "amount of circulation," while women rate more highly in "parental love" and "direct insight of relations."

footnote_6: >
  For more details on the history of "the modern synthesis," see Corning (2020).

footnote_7: >
  For an example of how the appropriateness of words can transition and why these changes sometimes do not make sense, see Elizabeth Marshall Thomas's (2006, 43--47) discussion of the various names given to the "Bushmen" of the Kalahari.

footnote_8: >
  I am thinking, for example, of one community of Central African Mbendjele, an unusually egalitarian society, who reportedly used to call their villager neighbors gorillas for their crude and aggressive behavior (Lewis 2002, 210).

footnote_9: >
  "So different is the taste of the different races, that our music gives not the least pleasure to savages, and their music is to us hideous and unmeaning" (Darwin 1871, 1:333).

footnote_10: >
  "We see that the musical faculties, which are not wholly deficient in any race, are capable of prompt and high development, for Hottentots and Negroes have become excellent musicians, although in their native countries they rarely practise anything that we should consider music" (Darwin 1871, 2:334).

footnote_11: >
  "But the most weighty of all the arguments against treating the races of man as distinct species, is that they graduate into each other, independently in many cases, as far as we can judge, of their having intercrossed. Man has been studied more carefully than any other animal, and yet there is the greatest possible diversity amongst capable judges whether he should be classed as a single species or race, or as two (Virey), as three (Jacquinot), as four (Kant), five (Blumenbach), six (Buffon), seven (Hunter), eight (Agassiz), eleven (Pickering), fifteen (Bory St. Vincent), sixteen (Desmoulins), twenty-two (Morton), sixty (Crawfurd), or as sixty-three, according to Burke. This diversity of judgment does not prove that the races ought not to be ranked as species, but it shews that they graduate into each other, and that it is hardly possible to discover clear distinctive characters between them" (Darwin 1871, 1:226).

footnote_12: >
  On the issue of blurry edges, it should be mentioned that it is shared by many other important concepts. For a few examples relevant to evolutionary biology, see the discussion of genes, individuals, and species in Godfrey-Smith (2014).

footnote_13: >
  Cross (2016), Mehr et al. (2021), and Shilton (2022) discuss these and other considerations.

footnote_14: >
  This assumption should not discount theories as strictly or mainly political; its proponents are as committed to science as those who reject it, and they can only be accepted on scientific grounds.

footnote_15: >
  The current debate is well portrayed by the two target articles and sixty commentaries published on the subject in 2021 in *Behavioral and Brain Sciences* (Savage et al. 2021; Mehr et al. 2021).

footnote_16: >
  For more on these theories, see Savage et al. (2021) and Mehr et al. (2021).

footnote_17: >
  I take inspiration here from Ted Gioia's (2019) overarching historical thesis in *Music: A Subversive History.*

