## Footnotes

footnote_1: >
  These terms refer to strong even-numbered measures and strong odd-numbered ones (Temperley 2008).

footnote_2: >
  Justin London (2012, 100--115) also discusses metric processes in this movement.

footnote_3: >
  The idea of becoming (Schmalfeldt 2011) refers to a reinterpretation of function (for example, main theme⇒transition) within a formal unit, often thanks to conflicting functional cues that suggest more than one interpretation simultaneously.

footnote_4: >
  Form-functional terminology derives from William Caplin (1998, 2013).

footnote_5: >
  Examples include "Uzh ty niva moya," op. 4 no. 5; Prelude in E Minor, op. 32, no. 4; and the *All-Night Vigil*, op. 37, on which see Bakulina (2015, 28--30).

footnote_6: >
  Another piece that plays with an eighteenth-century topic, in this case the minuet, is Rachmaninoff's Prelude in D Minor, op. 23, no. 3.

footnote_7: >
  Strictly speaking, m. 9 does not qualify as an HC in Caplin's taxonomy, since he requires the cadential dominant to enter in root-position form, whereas this V first occurs in a 6/4 position. This is one of the departures from Classical formal conventions. One solution to this problem is to consider the V6/4 on the second eighth note of m. 9 as an anticipation of the "real" V on the second quarter note. The bass line is Eß--D, a half-cadential motion, with the Bß--A understood to be inner-voice material. I will continue to refer to m. 9 as an HC, with the understanding that an HC may be a looser concept in early twentieth-century music than in music around 1800.

footnote_8: >
  This is equivalent to Caplin's (2013, 133--34) "thematic introduction" and Rothstein's (\[1989\] 2007, 68) "prefix."

footnote_9: >
  It is possible to regard mm. 5--9 as a loose consequent with a reharmonized basic idea, after an "antecedent" in mm. 1--5, but the HC in m. 9 disqualifies this reading.

footnote_10: >
  The fragmentation starting in m. 3 is somewhat unusual in a sentence, but there are Classical presentations consisting of two one-measure motives, too: the first movement of Beethoven's Piano Sonata op. 14, no. 2, for instance.

footnote_11: >
  "Essential" and "non-essential" refer to an eighteenth-century distinction (Burstein, Nguyen, and Roderer 2024).

footnote_12: >
  Each hybrid consists of a compound basic idea (c.b.i., mm. 3--5) and continuation. The c.b.i. resembles a sentential presentation (which might render the eight-measure phrase a sentence) due to the rhythmic equivalence of the two ideas, but the harmonic progression does not fit Classical sentential presentation schemes.

footnote_13: >
  See, in this connection, Hutchinson and Poon (2022).

footnote_14: >
  A third option would be a hypermetrical transition (Temperley 2008) between the odd-strong beginning and the even-strong ending of the antecedent. The consequent would then do the opposite: transition from even-strong to odd-strong hypermeter.

footnote_15: >
  Examples of re-barring existing music can be found in historical treatises such as Hugo Riemann's *Musikalische Dynamik und Agogik* (1884) (Rothstein 2008, 120--21).

footnote_16: >
  In the alternative, sentential reading of mm. 1--5, the extra beat would fit within a third, incomplete statement of the basic idea (based on m. 1) and the beginning of the continuation (mm. 3--5).

footnote_17: >
  Another temporary complication is introduced in the interpolation. The low bass Ds suggest an accent on the odd-numbered measures 11 and 13 of Example 3a; the accent subsequently returns to its previous position.

footnote_18: >
  Sergei Rachmaninoff, *A Window in Time: Rachmaninoff Performs His Solo Piano Works*, recorded 1919--29 (Telarc, 1998).

footnote_19: >
  The post-cadential function of the final section comes from a lengthy tonic harmony (sustained for either four or seven measures depending on individual reading), followed by repeated cadential progressions---a typical post-cadential technique (Caplin 2013, 135).

footnote_20: >
  In the alternative (sentential) reading of the opening measures, the recapitulatory passage I read as retransition⇒*a*′ would consist of a series of presentation-like phrases, what Rothstein (\[1989\] 2007, 296) calls a "Stollen process."

footnote_21: >
  The *a*′⇒post-cadential is a "dissolving recapitulation" (Bakulina 2020, 72), which involves hearing the final PAC only through retrospective reinterpretation.

