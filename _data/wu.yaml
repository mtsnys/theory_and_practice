## Footnotes

footnote_1: >
  Wang Amao (王阿毛, b. 1986) studied composition with Chen Yi, Zhou Long, James Mobberley, and Paul Rudy at the University of Missouri-Kansas City, where she received both her MA and PhD in composition. She is now Associate Professor of Composition at the Xinhai Conservatory of Music in Guangzhou, China. This piece was commissioned by Hu Yu (胡瑜, b. 1981), Associate Professor of Chinese board fiddle and Associate Dean of the Department of Chinese Music at the Beijing Central Conservatory, who also premiered the same piece on December 10, 2021. A recording of this premiere is available online (Wang Amao \[2023\]). This paper adheres to the Chinese naming convention, listing surname followed by the given name for the composer and the performer. An earlier version of this paper was presented at the 13th Biennial International Conference on Music Since 1900 in Leuven, Belgium and the 2024 Annual Meeting of the Society for Music Theory in Jacksonville, Florida. I am grateful for the insightful and constructive feedback provided by the reviewers during the development of this research. I also thank Trevor de Clercq and Kyle Hutchinson for their support throughout the writing process.
footnote_2: >
  The board fiddle (板胡), less known than the popular Chinese violin, the *erhu*, is noted for its piercing sound quality and ability to simultaneously play two strings, which inspired Wang to explore its auditory potentials. For comparison between the erhu and board fiddle, see Stock (1993, 277--80).
footnote_3: >
  The recording referenced in this article refers to Wang Amao (2023).
footnote_4: >
  My interviews were conducted over multiple days from September 2023 to June 2024. I will specify each interview date for different quotations.
footnote_5: >
  Pentatonic scales are the primary pitch foundation for traditional Chinese art and folk musics. Many Chinese composers of the twentieth and twenty-first centuries continue to embrace pentatonicism in their works. For a general survey of pentatonic usage, see Antokoletz (2014, 466--75). For a more focused examination of the integration between pentatonicism and serialism, see Rao (2002).
footnote_6: >
  For related discussion on infinite changes, see Wang, "Philosophizing Time in Sinitic Opera" (2023).
footnote_7: >
  I borrow the English translation for these four stages in Nancy Yunhwa Rao's 2020 article, where she examines the influence of Tang poetry narrative techniques on musical structure and momentum in Chen Yi's chamber work *Happy Rain on a Spring Night*.
footnote_8: >
  Interestingly, during the 2024 SMT Annual Meeting (November 9, 2024), Philip Stoecker and Matthew Arndt enthusiastically shared with me that they perceive this phrase as more closely aligned with a Western sentential structure, where disposition establishes presentation, development suggests continuation, and turn and end together create closure.
footnote_9: >
  The reader can go online to experience this 6/8 interpretation (Wang Amao \[2023\], 0:37--0:52).
footnote_10: >
  The reader can go ahead first to Example 7(b) for the construction of the pentatonic E-*shang* mode, derived from the pentatonic collection on D. Like Western diatonic modal structures, the pentatonic scale can generate five distinct modes through successive rotations: *gong* mode (宮調式, original position), *shang* mode (商調式, first rotation), *jue* mode (角調式, second rotation), *zhi* mode (徵調式, third rotation), and *yu* mode (羽調式, fourth rotation). For details on Chinese modal theory, see Ho and Han (1982, 133--35).
footnote_11: >
  Horlacher (2011) also examines how varied iterations of a melody sectionalize different formal blocks in Stravinsky's works from his Russian and Neo-Classic periods. My alignments of the narrative segments in Example 5 draws inspiration from Horlacher's graphical representations.
footnote_12: >
  Pitch-wise, the B~5~--A~5~ (m. 12) and Fƒ~5~--A~5~ (m. 13) in B´ are motivically derived from the descending major second and ascending minor third in segment C (mm. 3--4). Rhythmically, however, Hu defines mm. 12--13 as the development segment B´ because it follows A´ and initiates minor rhythmic activities, similar to the situation in segment B, block 1.
footnote_13: >
  Such as different dynamic markings in C/C´ or tremolos in C´´.
footnote_14: >
  Horlacher (1995, 300).
footnote_15: >
  Sullivan also claims that the absent attacks can include rests (2023, \[4.3\]).
footnote_16: >
  Mirka (2009, 39), based on various forms of accents and changes in music, further classifies the rules into six different types that influence metric perception: subjective, phenomenal, structural, grouping, streaming, and parallelism. The groupings discussed in this paper correspond to her subjective category (e.g., strong beat early), phenomenal category (e.g., dynamic and durational stress), and parallelism category (e.g., thematic parallelisms).
footnote_17: >
  Following Sullivan's system, the quarter-note level is indicated with solid arrows, as it has been subconsciously elaborated in the preceding measures and now surfaces for the first time.
footnote_18: >
  The original non-rotated form is called the pentatonic D-*gong* mode (D 宮調式). For constructions on various Chinese modal pentatonic forms, review footnote no. 10.
footnote_19: >
  It is crucial to emphasize that the ƒ and ß signs used for scale-degrees are intended to *conceptually* highlight the strong semitonal relationship linking the chromatic pitches to their closest pentatonic scale-degrees. They abstractly correspond to the accidentals of the actual pitches as notated in the score.
footnote_20: >
  The other three hypermetrically strong beats are emphasized by either strong dynamics (m. 15 and m. 19) or the breakdown of the B--D motivic parallelism (m. 16).
footnote_21: >
  The voice-leading notes are drawn from those shaded pitches in Example 8(a).
footnote_22: >
  I must clarify that I treat these projections as if the performance were strictly in time, because Hu puts so much rubato that it adds a level of fluidity and irregularity, which obscure the projections. They may delineate the first kind of Sullivan's ameter (the unconfirmed), where attacks are spaced unevenly and do not confirm the initial hypothesis. I appreciate one of the reviewers for pointing this out to me.
footnote_23: >
  Based on melodic parallelism, I also use solid arrows to indicate the 6/8 at the beginning of segment a´´. This segment repeats the melodic and intervallic components of descending major seconds and ascending minor thirds, while omitting the initial eighth-note and dotted-note pattern present in the original segment a.
footnote_24: >
  Additionally, Sullivan (2024) extends his concept of moment-to-moment rhythmic structure by drawing parallels to the meter of poetic texts, which he describes as "rhyme-oriented reading" (338) or "poetic phenomenal accents" (340).

