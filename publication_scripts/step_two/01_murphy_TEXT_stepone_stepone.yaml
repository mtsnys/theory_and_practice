## Footnotes

footnote_1: >
  Content warning: this article will discuss songs that address difficult topics including death and suicide. I have added a \* beside the headings for songs with sensitive topics.

footnote_2: >
  I am indebted to Rings (2013, \[24\]) for first bringing this songbook commentary to my attention. Rings's study also cites that Seeger's text is quoted in Heylin's (2011, 82) study of Bob Dylan, "which also notes Dylan's highlighting of the passage" in his own copy of the songbook.

footnote_3: >
  Seeger (1960, 4) also mentions that Guthrie recorded "many of the songs" from the *Anthology* himself.

footnote_4: >
  Metric irregularities are also common features of old-time and country music. Neal (2002) finds expressive irregular meter in the music of Jimmie Rodgers; Rockwell (2011) analyzes multiple occurrences of stylistically "crooked" meter in the Carter Family songs.

footnote_5: >
  Seeger also discusses general features of irregular meter like extra beats added to measures and melodies changing "rhythmically from verse to verse, to fit the words exactly" (1960, 4).

footnote_6: >
  For more on the self-expressive use of flexible meter in songs by Dylan's and his singer-songwriter contemporaries, see Murphy (2023).

footnote_7: >
  For example, Murphy (2023, 18--21) discusses the impact of folk revival sources on Dylan's self-expressive flexible meter. For more on Dylan's general stylistic influences, see Harvey (2001).

footnote_8: >
  Many thanks to Joti Rockwell for the suggestion of "performed-out" (rather than "composed-out") as better suited to this popular music repertoire.

footnote_9: >
  Alan Lomax recorded Guthrie for the Library of Congress in 1940, alongside other field recordings for the album *Anglo-American Ballads, Volume One*. For more on Guthrie, see Reuss (1970).

footnote_10: >
  Albin Zak (2004, 623--624) describes Guthrie as "mythic" emblem for "a central strain" of Dylan's musical experience.

footnote_11: >
  Guthrie's refrain of "gone with the Gypsy Davy" has similarities to Version C in the Child Ballads (Child 1882, 67), which includes the line "She's awa wi Gipsey Davy!" as the final line of stanza 8. Multiple transcriptions of this song (from performances from 1916) are included in Campbell and Sharp (1917, 112--118).

footnote_12: >
  Grey circles indicate which melody notes are elongated between stanza 1 lines 1--2 and stanza 3, lines 1--2. I have also included dotted brackets above the lower staff with annotations to show how much longer the melody notes are and where rests have been added.

footnote_13: >
  Everett (2008, 191) also observes the practice of composed-out fermatas as a method of phrase length irregularities in the music of the Beatles.

footnote_14: >
  Benjamin explains: "In a *fermata*, the metric flow at all levels is suspended; the counter stops counting but keeps track of where he was in his count . . . A *fermata* applied to a metric span always lengthens that span in an objective sense---often to a marked extent---but never increases the distance of its initiating beat from the next one on the same level in a metric sense" (1984, 397).

footnote_15: >
  To simplify these diagrams and for ease of comparison between verses, I have not included accompaniment in these transcriptions but have shown chord changes above the staff. In some cases, I have simplified melodic rhythms but made an attempt to retain accurate downbeat placements. I encourage readers to listen to the recording clips and follow along with my vocal transcriptions to hear the accompaniment strumming patterns.

footnote_16: >
  Guthrie's characterization of Floyd as a "Robin Hood" type character is a major critique of his "Pretty Boy Floyd" lyrics, which elaborate on Floyd's biography for the appeal of a "good outlaw" narrative. For more on Guthrie and this song, see Reuss (1970, 287).

footnote_17: >
  This first melody is a metric but not a melodic prototype for the passages that follow. It sets Aƒ~3~-Cƒ~4~-Dƒ~4~-Cƒ~4~ rather than the Aƒ~3~-Cƒ~4~-Cƒ~4~-Dƒ~4~ melodies of the lines that occur in subsequent stanzas.

footnote_18: >
  I will return to this technique later in the section on *elongated harmonic zones*.

footnote_19: >
  Commentary from other folk-ballad sources point to "pleasing" and "charming" effects of metric irregularities in performance. For example, commentary in Campbell and Sharp (1917) on their transcription of Appalachian ballad performances from the early twentieth century suggests that, in addition to adding interest to strophic songs, disrupting metric regularity seems to be an essential component of the "magical" impact of these song performances; see Campbell and Sharp (1917, x).

footnote_20: >
  For more on Smith's collection, see Marcus (1997). The *Anthology* represented advancements both musically and socially: it took advantage of the relatively new 33 1/3 rpm 12" disc LP medium, and it positioned previously segregated artists alongside each other on long-play records. As Neal explains, in the early twentieth century, musicians were catalogued not by musical style but rather by race: "hillbilly records" included recordings by white musicians and "race records" by Black artists (2002, xiii). By 1952, the latter had become "Rhythm and Blues" and the former "Country and Western" (Rosenberg 1997, 36).

footnote_21: >
  Some examples of these recordings in the 1960s include Dylan's version of "See That My Grave Is Kept Clean" (Blind Lemon Jefferson) on his eponymous 1962 debut album, Sainte-Marie's version of "House Carpenter" on *Little Wheel Spin and Spin* (1966), Van Ronk's "House Carpenter" on *Inside Dave Van Ronk* (1964), and Joan Baez's version of "The Wagoner's Lad" on *Joan Baez, Vol. 2* (1961). For commentary on the influence of the *Anthology* being retroactively overstated, see Hair and Smith (1997).

footnote_22: >
  This song is also analyzed by Tobias Tschiedl (2020), who tracks the varying time spans between stressed syllables of Kazee's performance. Several recordings of "The Butcher's Boy" predate Kazee's *Anthology* version. Two available versions have entirely regular metric settings and place their first hyperdownbeats on the second stressed word. Henry Whitter's 1925 recording also features a four-beat text structure (i.e., "In **John**-son **cit**-y where **I** did **dwell**") with a weak--strong hypermetric setting. Kelly Harrell's 1925 version, four stressed syllables span each two-bar unit of triple meter. The first and third stresses align with beat 3 while the second and fourth stressed words receive downbeat emphasis (i.e., "In **Lon**-don **[cit]{.underline}**-y where **I** did **[dwell]{.underline}** / The **butch**-er's **[boy]{.underline}** I **lov**-ed so **[well]{.underline}**"). Either of these recordings may have influenced Kazee's underlying four-beat structure---with metric emphasis on the second beat---though, neither recording contains performed-out fermatas. Many thanks to one of the anonymous reviewers for recommending these two recordings. Seeger (1972, 50) includes a transcription of Woody Guthrie's 1954 cut-time version of this song, which emphasizes the same syllables as the 1925 recordings ("In **Jer**-sey **Cit**-y where **I** did **dwell**") and places hyperdownbeats on the second stress of each line.

footnote_23: >
  This transcription follows the metric and hypermetric structure shown in Raim (1973, 28). Kazee includes nearly identical performed-out fermatas---in both location and length---in the first stanza of his 1958 recording on *Buell Kazee Sings and Plays*.

footnote_24: >
  For this transcription and those that follow, I only include brackets and lengths of the long-held melody notes with the possible prototype rhythms implied as whatever duration would fill a single measure with the pitch that follows the held note. For example, in the first instance of performed-out fermata, the Cƒ~4~ could have been a quarter note within a possible second bar with the Aƒ~4~ that follows.

footnote_25: >
  In this transcription, I suggest that "went" aligns with a hyperdownbeat. It is also possible to hear "stairs" as the beginning of the hypermeasure, with "She went up" as a large anacrusis. This possibility would shift each hyperdownbeat in Example 5 one bar later.

footnote_26: >
  I thank one of the anonymous reviewers for this observation.

footnote_27: >
  White classifies the song as "Folk Lyric" with a narrative "of unhappy love that \[is\] of uncertain content, taking up or sloughing off phrases and images as they pass through the minds and feelings of singers" (1952a, 275--279). The transcriptions in White (1952b, 157--162) show fermatas in the melody: in some locations they appear on the first note, in others on a mid-phrase pitch, typically a high note. Version B(a) also includes time signature changes. These versions, from 1936--1941, retain the metric play of Kazee's 1928 version. Version H has no fermatas (save for the final note) or metric irregularities.

footnote_28: >
  Campbell and Sharp's (1917, 216) Version B of this song, transcribed in 1908, includes an anacrusis to each of the stanza's four lines and has a similar melodic contour to Kazee's version. Since this version was recorded in Clay County, Kentucky, about 100 miles from Morehead, KY, where Kazee lived, it is possible that the elongated version was part of an oral tradition that influenced Kazee's own performance .

footnote_29: >
  Neal finds examples of vocal fermata in country music to be techniques of expression, what she calls "structural reinforcement" of a singer's "emotional resignation or regret, and potential lost love" (2000, 122).

footnote_30: >
  It is also possible to hear the lyrics in stanza 1, line 4 as "receiving [their]{.underline} strict orders."

footnote_31: >
  Norm Cohen explores the history of this song, recorded both as "Engine 143" and "The Wreck on the C & O." Cohen cites factual issues in the circulated lyrics for more than 70 versions of the song, proposes that its original composer was "raised in the Anglo-American broadside ballad tradition," and assumes that it was written several years after the train wreck occurred, "when some of the details had been forgotten or become confused in the author's mind" (1981, 183--196). Of the Carter Family's version, Cohen suggests that Sara Carter learned the song as a teenager, "probably less than twenty years after the incident," and the text she provided for the Carter Family version is "considerably truncated and stripped of details" (1981, 194).

footnote_32: >
  The rhythm of the text might have been a determining factor for where the performed-out fermatas would occur. The unexpanded phrases (lines 3 and 4) have only three stressed syllables for each line segment: "**Run**-ning **in** to **Sou**-ville" and "head-**quart-**ers **on** the **line**" in line 3 and "Re-**ceiv**-ing **ver**-y **strict** **or**-ders" and "from a **sta**-tion **just** be-**hind**" in line 3. The phrases expanded by performed-out fermatas (like lines 1 and 2), have four syllables with an extra bar after the fourth. (Line 1, for example has "A-**long** **came** the **F**. F. **V**. \[extra bar\]" and "the **swift**-est **on** the **line** \[extra bar\]). This pattern continues throughout the song, with three-stress line segments set to four bars and four-line segments including an extra fifth bar. Many thanks to one of the anonymous reviewers of this article for pointing out this text-stress pattern and its possible impact on the Carter Family performance.

footnote_33: >
  On first listening, the shift to the refrain is almost imperceptible because there is no change of harmony at "John done saw that number."

footnote_34: >
  Another example of this style can be found on the "Social Music" *Anthology* volume, with Blind Willie Johnson's self-accompanied performance on "John the Revelator" with singer Angeline Johnson. Blind Willie Johnson is also described in the *Anthology* liner notes as a "guitar evangelist" (Place 1997, 54).

footnote_35: >
  Mason uses a similar technique on his 1928 performance of "Judgement Day in the Morning." This and other recordings from his guitar evangelist style can be found on *Alabama: Black Secular & Religious Music (1927--1934)* (1993).

footnote_36: >
  In addition to the two songs explored in this study, Dylan's "Freight Train Blues" (1962) also features a performed-out fermata on the word "blues" (1:11--1:25), with the vowel sound resembling a train whistle.

footnote_37: >
  Harvey (2001) traces many of Dylan's early 1960s songs to plausible sources, including to Guthrie and tracks on Smith's *Anthology*.

footnote_38: >
  For more on "Man of Constant Sorrow," see Harvey (2007; 2001, 65--67).

footnote_39: >
  Dylan is indebted to Guthrie for inspiration in the talking blues style, as explored in Harvey 2001 (102--105). Harvey (50--52) cites the 1944 "Guthrie et al. recording of 'We Shall Be Free'" as the "immediate source" for Dylan's "I Shall Be Free" from *The Freewheelin' Bob Dylan*.

footnote_40: >
  For example, Murphy (2020) explores the impact of timing flexibilities in "With God on Our Side," which reflect both the political lyrical theme of the song and the broader unpredictability of Dylan's early performance style.

footnote_41: >
  Songs in Table 1 are in chronological order.

