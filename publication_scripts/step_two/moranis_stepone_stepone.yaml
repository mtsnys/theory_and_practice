## Footnotes

footnote_1: >
  David Yaffe (2023) wrote about Mitchell's 2022 Newport performance, "While her voice remained deeper, it has gotten much clearer, and much more supple." In a review of *Taming the Tiger*, Stuart Maconie wrote, "She's never sung better, either, the clear and precise enunciations now gone nicely husky" (\[1998\] 2017, 211). In a 2014 article, Renee Montagne wrote, "She's luxuriated in a voice that got deeper with age" (Mitchell 2014).

footnote_2: >
  Betty Clarke (2002) writes the following in her review of *Travelogue*: "If the health warning isn't enough to put you off cigarettes, the nicotine-ravaged vocals of the once angelic, now gasping Joni Mitchell should. Mitchell's voice is a husky shadow of its formal feather-light glory."

footnote_3: >
  Mitchell has written and performed political songs throughout her career, such as "Big Yellow Taxi" (1970). Notably, these topics became the focus of later music, especially on *Shine* (Gumbel 2007).

footnote_4: >
  The term "formant" will be defined in part 3 of the article.

footnote_5: >
  Fitting a linear trendline to the midpoints of the vocal range in each of Mitchell's songs shows that the midpoints trend downwards from approximately Fƒ~4~ to C~4~.

footnote_6: >
  Mitchell has sung lower notes outside of her studio albums; on "A Case of You" from *Live at Newport* (2023), she sings Aß~2~.

footnote_7: >
  Audio examples can be found on the *Theory and Practice* website.

footnote_8: >
  Mitchell's ranges in the re-recordings of "Amelia" and "Hejira" match those of the original recordings.

footnote_9: >
  By vocal agility, I mean the ability to traverse wide pitch ranges with speed. Mitchell's vocal agility in earlier albums was not without criticism, either; Tom Nolan (1975) wrote of her 1974 live album *Miles of Aisles* that her voice "leapt all over the place in a shrill demonstration of technique. ('Congratulations to Joni Mitchell upon her conquest of the octave,' Richard Goldstein wrote sarcastically of her first album.)"

footnote_10: >
  Reymore built this model by conducting interviews (*n* = 23) and rating tasks (*n* = 460) "based on imagined instrument timbres" (2020, ii).

footnote_11: >
  Others have written about the evolution of certain Joni Mitchell songs: Lloyd Whitesell (2008) conducts an analysis of the "evolution of Mitchell's own conception of 'Woodstock'" (34), Timothy Koozin (2024) analyzes recordings of Mitchell's "Both Sides Now" from 1969, 2000, and 2022, and Joanne Winning (2019) compares versions of "Both Sides Now" from 1969 and 2000. Beyond Mitchell, Steven Rings (2013) analyzes Bob Dylan's vocal evolution through performances of the song "It's Alright, Ma (I'm Only Bleeding)" from 1964 until 2009.

footnote_12: >
  Mitchell performs lead vocals and Appalachian dulcimer, James Taylor performs on acoustic guitar, and Russ Kunkel performs on percussion.

footnote_13: >
  Mitchell performs lead vocals, lush strings provide the harmonies, individual woodwind instruments (e.g., flute, oboe) play solo lines, and a snare drum is played with brushes in a jazz style. This version was arranged and conducted by Vince Mendoza and performed by members of the London Symphony Orchestra alongside jazz musicians such as Wayne Shorter on saxophone.

footnote_14: >
  Perfect fourth transpositions are not unusual; several Genesis songs on their farewell tour (2021--22) were also lowered in key to accommodate Phil Collins's changing vocal range, including their most successful hit, "Invisible Touch" (US #1, 1986), which was similarly lowered by a perfect fourth. Mark Spicer posits that this transposition distance around the circle of fifths is likely not a coincidence and may be less drastic for audiences (personal communication).

footnote_15: >
  Mitchell performs lead vocals, Brandi Carlile and Marcus Mumford perform backup vocals, piano replaces dulcimer and guitar, and electric strings are featured.

footnote_16: >
  These observations were made while personally attending the live Joni Mitchell and the Joni Jam performance at the Hollywood Bowl on October 19, 2024.

footnote_17: >
  Mitchell's agency is apparent when contrasting this performance with her 2022 performance from the Newport Folk Festival, where she mostly sang the harmony below Brandi Carlile's melody.

footnote_18: >
  I limited my investigation to Mitchell's 19 studio albums and the 2023 recording of Mitchell's 2022 appearance at the Newport Folk Festival (entitled *Joni Mitchell at Newport*).

footnote_19: >
  Formant frequencies are increasingly being used as tools to analyze instrumental timbres in addition to those of the voice (Reuter et al. 2024; Reuter, forthcoming).

footnote_20: >
  Others compare formant frequencies over time to chart the phonetic change of a specific individual: Josiane Riverin-Coutlée and Jonathan Harrington (2022) conduct a longitudinal analysis of public French speaker Michaëlle Jean, charting specific vowels present in Québécois French that are absent from other French-speaking regions.

footnote_21: >
  I used LALAL.AI to extract an isolated vocal track from the song's original audio. In the absence of the real isolated vocals (i.e., from the producer or record company themselves), vocal tracks created using source separation software allow for reasonably accurate analysis. I then used the speech analysis software Praat to obtain the mean frequency for each formant. Praat estimates the first five formant frequencies, but I only analyzed formants 1 and 2.

footnote_22: >
  These vowels are from the word "feel" in "Willy" (*Ladies of the Canyon*) and "Both Sides Now" (*Both Sides Now*).

footnote_23: >
  These vowels are from the word "road" in "All I Want" (*Blue*) and "Wild Things Run Fast" (*Wild Things Run Fast*). I limited my analysis to a stable section of the diphthong: I selected only the /o/ component of the diphthong vowel by ear.

footnote_24: >
  These vowels are from the word "feet" in two different recordings of "A Case of You" (*Blue*, *Joni Mitchell at Newport*).

footnote_25: >
  These vowels are from the word "you" in "See You Sometime" (*For the Roses*), "Down to You" (*Court and Spark*), "Jericho" (*Don Juan's Reckless Daughter*), "My Best to You" (*Taming the Tiger*), "For the Roses" (*Travelogue*), and "Both Sides Now" (*Joni Mitchell at Newport*). I listened to each vowel to ensure that I chose sections of the diphthong that were sonically equivalent.

footnote_26: >
  These vowels are from various words: "plane" in "Nathan La Freneer" (*Song to a Seagull*), "lady" in "Willy" (*Ladies of the Canyon*), "plane" in "Black Crow" (*Hejira*), and "plane" in "Dreamland" (*Don Juan's Reckless Daughter*). I listened to each vowel by ear to ensure that I chose components of the diphthong that were sonically equivalent.

footnote_27: >
  An exception to this is the word "feet" in "A Case of You" from 1971 and 2022. Mitchell maintained the same key but sung an octave lower in 2022. "Feet" was sung on Dß~4~ as the low tonic note in 1971 and as the high tonic note in 2022.

footnote_28: >
  Accent may also play a role here; Mitchell's Canadian accent, which she still holds onto, is sometimes more or less present in her singing voice depending on the genre at hand. Mitchell said that singing with David Crosby, Stephen Stills, and Graham Nash specifically influenced her accent: "In order to blend with them you had to adopt a kind of vocal affectation to get the blend. . . . Suddenly I have kind of an overt American accent, to my ear anyway, being Canadian, on the second album which kind of dies down by the time you get to the third" (Mitchell \[1986\] 2002).

footnote_29: >
  Mitchell said, "There are showy, fun songs that will accommodate a certain amount of winky-wink, nod-nod from the stage, but on these intimate things you almost have to sing with a method acting kind of way---you have to find your sincerity like an actor does" (Mitchell \[1997\] 2000).

footnote_30: >
  Karppinen asserts that audiences may have criticized Mitchell's voice in her jazz records because she is not a "natural jazz singer" in terms of her identity, like "Ella Fitzgerald and Billie Holiday---black female singers of the big band era" (2016, 150).

footnote_31: >
  Vocal damage and race are sometimes intertwined. Rudolph Fisher, a medical student in the 1920s, wrote that singers in Harlem "wore themselves ragged trying to rise above the inattentive din of conversation, and soon, literally, yelled themselves hoarse; eventually they lost whatever music there was in their voices and acquired that familiar throaty roughness which is so frequent among blues singers, and which, though admired as characteristically African, is as a matter of fact nothing but a form of chronic laryngitis" (Fisher \[1987\] 2008, 334; Stras 2006). While Mitchell sang in a jazz rather than blues style, her vocal style, a combination of creative choice and vocal damage, can be heard as her trying to emulate Black blues voices.

footnote_32: >
  Of her voice on the 1974 *Miles of Aisles* album, Mitchell said, "My voice is gone . . . I sound like an old spade" (Monk 2012, 244). Mitchell may have used this phrase as code for a Black person, slang that emerged in the 1920s during the Harlem Renaissance (O'Conner and Kellerman 2009, 126--29). By using this term to refer to her voice, Mitchell seems to consider her voice as sounding Black; the statement also seems to carry a derogatory connotation, criticizing the sound of her changing (or failing) voice.

footnote_33: >
  When asked, "Why do you hate critics so much?," Mitchell responded, "They hold you in your decade" (Eggar 2007).

footnote_34: >
  Straus argues that late style "may in some cases be more richly understood as disability style: a perspective composers may adopt at any age, often in response to a personal experience of disability" (2008, 6).

footnote_35: >
  Kinney calls attention to reception differences of aging voices across genres: "While older voices in popular musics can index themes such as authenticity, wisdom, and experience, the sounds of aging in opera are virtually always heard as deficits that detract and distract from the aesthetic appreciation of a performance" (2023, 8).

footnote_36: >
  Holiday and Sinatra performed into their forties and seventies respectively. While Holiday passed away at the age of 44, her voice underwent an extreme evolution, so much so that in her last years, such as on *Lady in Satin* (1958), her voice sounded like it belonged to someone much older.

footnote_37: >
  Michelle Mercer (2009) includes Holiday and Sinatra as singers that Joni Mitchell said she loved. Mitchell said, "Billie Holiday was more than a singer; Frank Sinatra was more than a singer. There were a lot that were Method actor singers" (Mercer 2009, 214). Mitchell putting these singers in the same breath and calling them "more than" singers may mean she was talking about age and vocal evolution.

footnote_38: >
  Elliott writes, "Decay is modelled in Mitchell's voice . . . to become a harsh chronicle of the traces life leaves on the body" (2015, 227).

footnote_39: >
  Conversely, asserting that Mitchell's creative vision was the sole factor in her vocal evolution also ascribes one's own judgments onto her vocal transformation.

footnote_40: >
  For fans who were young when Mitchell released her first albums, Mitchell's evolution as an aging performer may parallel certain elements of their own lives as they have grown older themselves (Bennett 2013).

footnote_41: >
  Of her Newport performance, Lindsay Zoladz (2022) writes, "There was an intergenerational tenderness to the performance, the way that some of the younger musicians (Marcus Mumford, Blake Mills, Jess Wolfe and Holly Laessig of Lucius) appeared to be in palpable awe of what was happening even as they kept time and in tune." Brandi Carlile, 38 years Mitchell's junior and the inspiration for Mitchell's comeback at Newport, and other young artists such as Jon Batiste and Jacob Collier, joined Mitchell at her Hollywood Bowl performances.

footnote_42: >
  Mitchell began to write her own songs in 1964, four years before *Song to a Seagull* was released (Mitchell 1968a).

