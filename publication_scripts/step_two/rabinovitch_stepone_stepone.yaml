    The opening of Bach's symphony is analyzed briefly in Yust (2018, 187--88); my article offers a complementary, informal analysis of tonality, meter, and form in this piece.

footnote_2: >
  As Burstein (2020) stresses, Koch's (1782--93) terms such as *Quintabsatz* are not synonymous with HC or other modern-day cadence labels: these points of formal punctuation can be realized in a variety of ways, some of which appear non-cadential to present-day eyes. In this particular piece, all resting points also qualify as cadential under present-day definitions.

footnote_3: >
  Some of the relations discussed below---e.g., the problem of meter finding---are likely to be perceived by listeners with less exposure to galant music, whereas others---e.g., punctuation form and galant schemata---would be more meaningful for listeners deeply enculturated in the galant style (i.e., probably a minority of listeners today). I have opted for an eclectic and ad hoc approach in an attempt to facilitate an analytical adventure for present-day readers.

footnote_4: >
  As Byros (2012, 2022) elegantly shows, the perception of tonality is influenced by musical usage and schemata. Among many theoretical concerns, Byros (2022) tracks the embedding of diminished seventh chords in figured-bass manuals. Rather than being open to enharmonic reinterpretation in every which way, diminished seventh chords in the long eighteenth century were embedded within specific patterns of resolution with specific tonal implications. When a diminished seventh sonority proceeds up a semitone in the bass to a minor 6/4, its bass is \^ƒ4 in all cases (probability of 1); when a diminished seventh proceeds up a semitone in the bass to a root-position minor triad, its bass is \^7 in all cases. These are also the two most frequent resolutions in a corpus of diminished seventh chords derived from Bach (1753--62) and Albrechtsberger (\[1793\] ca. 1807), strengthening the connection to practices of improvisation. Byros's data suggest that we can unambiguously infer a local context from Bach's two-chord successions in mm. 19--20 (A minor) and mm. 21--22 (B minor).

footnote_5: >
  In Kirnberger's (1982, 139--40) terms, a modulation to minor v represents the first level of distant modulations.

footnote_6: >
  I am of course inspired here by Lerdahl and Jackendoff's (1983, 74, 86) unbarred representations of the opening of Mozart's Symphony in G Minor, K. 550; see also Mirka's (2009, 49--50) survey of Koch's discussion of metric notation.

footnote_7: >
  I recommend the recording by Andrew Manze and the English Concert (Harmonia Mundi, 2006), which takes a somewhat hesitant, fantasy-like approach to this opening.

footnote_8: >
  For an entry point into discussions of authorial intent, see Haimo (1996).

footnote_9: >
  This is letter #22 in Clark's numbering (1997, 17--18). Suchalla's edition (Bach 1994, 1:177--79) has a fragmentary version of this letter, which does not include this key phrase---hence I was unable to consult the German original that underlies Clark's translation.

footnote_10: >
  The first edition (Kirnberger and Schulz 1774) would have been available to Bach while working on the symphony. See also the discussion of subjective rhythmization in London (2012, 13--15).

footnote_11: >
  Bach's up-and-down gestures resonate with Kirnberger's metaphors: for instance, mm. 67--68 (discussed subsequently) display a continuous up-and-down motion (whose pattern conforms to the level of an entire measure); mm. 24--26 contain a free fall through pitch space as well as a bounce-back effect of a virtual moving body. This free fall would not be metrically clear were it not for the effect of a zigzagging alternation. Moreover, the turning point on the downbeat of m. 26 reinforces the meter.

footnote_12: >
  I am skirting here Kirnberger's account of the interactions among meter, tempo, character, and possible subdivisions to focus on issues more directly relevant to my inquiry.

footnote_13: >
  See also the discussion of *alla breve* in Kirnberger (1982, 386--87), as well as the counterpoint-exercise-like mm. 35--48 of Bach's symphony, discussed below.

footnote_14: >
  On tonally open and linked movements in Bach's fantasy-influenced compositions, see also Wollenberg (2007, 126--27). The tonally open ending of the first two movements and the unusual tonal relation of the inner movement (key of ßII) certainly give Wq. 183/1 a fantasy-like character.

footnote_15: >
  See also the comments in Mirka (2009, 45--46), drawing on Kirnberger and Schulz (1774, 983; \[1794\] 1967, 101), regarding the affinity between pitch height and dynamic accent.

footnote_16: >
  Compare this to Mirka's (2009, 33--35) observations about the opening of Haydn's Quartet op. 50, no. 6, first movement.

footnote_17: >
  Mirka (2009, 39) lists these factors as "initial accent" and "binary regularity"; they are equivalent to Lerdahl and Jackendoff's (1983) "strong beat early" and "binary regularity" metrical preference rules. Lerdahl and Jackendoff's (1983) parallelism rule is MPR1.

footnote_18: >
  As Temperley (2008, 318) observes, "Not all harmonic changes are equal." The root-preserving harmonic change from I to V^7^/IV is not as strong as the change to IV in m. 6. As Mirka (2009, 50--52) surveys, harmonic change is a most powerful preference factor.

footnote_19: >
  Andrew Manze and the English Concert (Harmonia Mundi, 2006) perform the passage in this manner. By contrast, Ton Koopman and the Amsterdam Baroque Orchestra (Erato, 1990) take a metronomic approach that supports the notated meter.

footnote_20: >
  This timbral differentiation is brought out particularly clearly in a live 2018 recording by the WDR Symphony Orchestra, conducted by Andrea Marcon (<https://www.youtube.com/watch?v=bVhV-Qwlc5Y>).

footnote_21: >
  Burstein observes: "It would be too restrictive and tautological to argue that the first half-cadential break that precedes a new-key theme must by definition be regarded as the medial caesura. If the concepts of the medial caesura and post-medial caesura are to have implications for interpretation and performance, some features must suggest that the medial caesura proper could be fairly portrayed as having greater formal weight" (2020, 272n21). Perhaps the fact that the paired *Quintabsätze* in V follow the order cantabile-then-*rauschend* can be viewed as a deviation from the convention of starting with a more active *Quintabsatz* and moving to a more cantabile one (see Burstein 2020, 61--63); such a pairing does not necessarily correspond to what we would now label as transition and secondary theme (Burstein 2020, 86). In any case, this seems like a minor deviation from the mold.

footnote_22: >
  Caplin (2015, 41) discusses the respective "syntactical strength" of a Prinner ending on \^3 and a Prinner continuing on to an HC ending on \^2. Although Caplin de facto subsumes the analytical object "Prinner" under his form-functional apparatus, his discussion demonstrates the wealth of possibilities associated with this conventional skeleton.

footnote_23: >
  Note that the recognition of the le--sol--fi--sol schema was responsible both for historical listeners hearing a clear shift to G minor at the opening of Beethoven's *Eroica* Symphony as well as for invocations of improvisation (Byros 2012, 285).

footnote_24: >
  On the association between le--sol--fi--sol and HCs, see Byros (2012, 295--99).

footnote_25: >
  Hepokoski and Darcy (2006, 25) note the possibility of reaching a V:HC MC by way of a shift to the parallel minor. See also Long's (2024) discussion of minor-mode shifts in galant expositions.

footnote_26: >
  Both the single-note idea and the suspension-chain idea (in a 7--6 guise) are foreshadowed in the oboes and horns in mm. 27--30 and mm. 31--32 respectively. The former idea is also reinforced stereophonically through the first and second violins in alternation in mm. 27--30.

footnote_27: >
  Bach revisits such play between undivided motion and cadential schemata in the symphony's Finale (not shown). At its conclusion (mm. 102--13), an undifferentiated 13-note ascent culminates in \^3, which triggers a further ascent through \^3--\^4--\^5--\^6, that is, a Deceptive Cadence bass schema string, followed by \^4--\^5--\^1, a Complete Cadence (Gjerdingen 2007). The swarm of undifferentiated sixteenth notes leads to a ("statistical") local high point on \^3, which initiates a conventional Deceptive Cadence--Complete Cadence schematic pairing. Of course, the understanding that the high point on \^3 is a detached, activating schema event can happen only in retrospect, as the formulaic succession of scale degrees, \^4--\^5--\^6 and \^4--\^5--\^1, brings the Finale to a close.

