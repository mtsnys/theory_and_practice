## Footnotes

footnote_1: >
  Russ Landau, *Ancient Voices: The Survivor Themes (Soundtrack from the TV Show)*, Landau Music Group, 2003.

footnote_2: >
  *Survivor: Borneo* (season 1), episode 1, "The Marooning," May 31, 2000, CBS.

footnote_3: >
  "About," Russ Landau, updated 2026, https://russlandau.com/about/.

footnote_4: >
  Marina Devyatova, "Poydu-vïydu," released August 1, 2013, posted July 29, 2024, YouTube, https://www.youtube.com/watch?v=xyL2jII0Td8.

footnote_5: >
  See the performances by Krasnoyar'ye and YAR (https://www.youtube.com/watch?v=3t2UEgzsG70) and the Fyodorov Sisters (https://www.youtube.com/watch?v=UBRr5WFHLls). On tonal ambiguity in Russian music, see Bakulina (2014).

footnote_6: >
  The production team also created and published online versions for seasons 37 and 38.

footnote_7: >
  Location is stated at the beginning of every season. For example, when Survivor first filmed in the Philippines, the season was aptly named *Survivor: Philippines* (season 25). Until season 19, every season would have its own location and would be titled accordingly. Thereafter, seasons were filmed in pairs. For example, seasons 27 and 28, *Blood vs. Water* and *Cagayan*, were both filmed on Palaui Island, Santa Ana, Cagayan, Philippines (Dehnhart 2013). Paired seasons remained until season 33, when the show moved to the Mamanuca Islands in Fiji, where it has remained until the present.

footnote_8: >
  For instance, *Survivor: Borneo* (season 1), episode 1, "The Marooning," May 31, 2000, CBS; *Survivor: The Australian Outback* (season 2), episode 1, "Stranded," January 28, 2001, CBS; *Survivor: Africa* (season 3), episode 1, "Question of Trust," October 11, 2001, CBS.

footnote_9: >
  All reductions and score analyses in this paper are the sole work of the author.

footnote_10: >
  All decisions regarding which musical tradition most closely resembled each particular "Ancient Voices" were made by the author. All seasons' themes were viewed in their full state as shown in the first episode and analyzed as such. Some themes use shortened versions in successive episodes.

footnote_11: >
  It is obviously not the case that Oceania exclusively uses tresillos while Southeast Asia does not. Oceania is made up of thousands of islands and has hundreds of musical traditions. While culturally related, they are not homogenous.

footnote_12: >
  Vanacore is still in charge of the music production and theme songs for these seasons.

