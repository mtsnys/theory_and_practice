## Footnotes

footnote_1: >
  See Earp (1995, 241--43) on the difficulty of enumerating Machaut's lyrical output by genre given the variety of manuscript sources.

footnote_2: >
  Peraino (2011, 236) points out the same terminological insistence in Machaut's *Prologue*, section V, lines 14--15. She attributes Machaut's connection of the virelai with dance to French refrain songs called *rondets de carole* and *ballettes* and to the Occitan *dansa* (248). According to Earp (1991, 115), "It appears that Machaut was quite self-consciously preserving this genre \[virelai\] for the dance." He traces the development of the danced song genre in Machaut as a generic mixing of high courtly poetry with low metrical dance. Leach (2011, 159) notes that the virelai was, for Machaut, "very specifically a social dance form."

footnote_3: >
  Maw (2002, 76, table 1) lists mensurations and cadential plans in the 88% of Machaut's virelais that are set in imperfect *modus* and *tempus.* The small subset of triple time works, to be considered below, are not represented there.

footnote_4: >
  Examples of the flexible metrical interpretation of regular mensural notation can be found throughout Maw (2004, 2013), including transcriptions in mixed meters.

footnote_5: >
  Boone (2000) investigates regular rhythmic punctuation in the layered mensural pulses of medieval and Renaissance music. Maw (2002) furthermore contrasts mensuration as a temporal framework with common-practice meter: "While the theory of mensuration supplied a quantitative understanding of musical time sufficient to make sense of rhythm for the purposes of notation, metrical thought provided a supplementary qualitative understanding of musical time necessary in practice to make sense of rhythm for the purposes of musical effect" (70).

footnote_6: >
  Maw (2004, 62) addresses the methodologies and inconsistencies of *modus* barring in the complete editions of Machaut's secular songs (Ludwig 1926; Schrade 1956). See Maw (2002) for a systematic investigation of *modus* in Machaut's virelais, a flexible mensural level that requires analytical interpretation of musical groupings, and Maw (2013) for a supplemental study on text setting and meter. A complementary analytical account of flexible *modus* barring in Machaut's motets is undertaken in Lavacek (2022).

footnote_7: >
  My transcription of F-Pn fr. 25566, f. 129r. In Mullally's (2011, 119) translation: "My very sweet lively lady, listen to my heart beseeching you."

footnote_8: >
  Dillon (2015, 615) is clear that music interpolations "were not texts inviting performance or demanding connection with a specific melody, but rather were literary representations that transferred the medium of performance into the medium of writing, where sonic associations fade." For Rimmer (1991, 64), dance interpolations cue a "combination of particular kinds of spatial pattern and particular kinds of group-to-individual relationships in music and text, with particular kinds of social function." See Butterfield (2002, 42--71) on the sourcing and function of dance song in thirteenth-century romance and the narrative ramifications of evoking a certain performance practice through such interpolations. Boulton (1993, 285) discusses the function of some interpolated *rondets de carole* as music to convey the "ease and gaiety of the imperial court." The same interpolations also participate in the important nostalgic project of preserving a corpus of songs through literary record (275), perhaps especially for unicum refrains like this one. Huot (1987) details a shift from orality to literacy in the fourteenth century as manifested by a greater focus on the genesis of interpolated lyrics than on their performance, satisfying a growing demand for visually appealing books for reading, less as repositories of words to be spoken aloud. Of primary interest, then, is not the performance of an interpolated song. Rather, the illuminated manuscript itself has the performative quality of staging its own events (4). For this Huot draws due attention to the medieval scribe, compiler, and illuminator as *metteur-en-scène* of all the visual elements of a book. For an introduction to the medieval romance with musical interpolations see Coldwell (1981).

footnote_9: >
  McGee (1989, 506--11) equates the musical genre named the "vocal ductia" with the *carole,* a connection he furthers by citing poems of the same form called "carols" in fifteenth-century England. Peraino (2011, 248) attributes Machaut's connection of the virelai with dance to French refrain songs called *rondets de carole* and *ballettes,* and to the Occitan *dansa* (248). Chaganti (2018, 196) is clear that "song in *virelai* form came to replace the rondeau as an accompaniment to *carole.*" Machaut himself makes the connection between dance and the virelai in the *Remede de Fortune,* discussed below.

footnote_10: >
  An open (*ouvert*) cadence is identified with reference to a song's terminal pitch and implies future resolution in a closed (*clos*) cadence. Scale degrees \^2, \^5, and \^7 are customary sites of open cadence, all ultimately seeking \^1.

footnote_11: >
  Earp (1991, 113--14) credits the infiltration of *ars nova* motet rhythmic innovations into secular song with the disassociation of the *chanson baladée* from dance. Earp (2005, 106) "believe\[s\] that the early virelais of Machaut are better understood as highly artistic works that merely evoke characteristics of the old dance genre."

footnote_12: >
  Nevile (2008a, 30) and Dickason (2021, 177) describe caroling in the round. Morrison (2021) extrapolates the *carole*'s circular movement to a choreographic structuring of *Sir Gawain and the Green Knight*'s (14th c.) strophic form. That the *carole* could also be a line dance progressing through the streets of town is noted by Eustace and King (2011, 52--56), Page (1989, 115), and McGee (1989, 507). Dance formation has no bearing on my speculation here. Set beside the other songs of *Remede* in Mach C are depictions of people holding a scroll and sometimes a pen to illustrate reading and composing. On issues of class, gender, and social adhesion in the iconography of round dancing in Machaut's *Remede* and other medieval narratives, see Alexander (1996, esp. 151--53).

footnote_13: >
  See Peraino (2011, 239--42) for detailed elucidation of this song's lyrics and function within the *Remede.*

footnote_14: >
  Earp (1991, 126) claims that the storyline of the *Remede* was contrived to demonstrate each type of song then current, whereas Peraino (2011, 235) calls the *Remede* "in effect a musical *summa.*" See also Earp (2005, 105--6) on the virelai as danced song in the *Remede.* Dickason (2021, 174ff.) explores the *carole* dance's role in sacralizing courtly love in the medieval romance *Roman de la Rose.* See Butterfield (2002) for the generic characteristics of *romans à* *chansons* and Stokes (2014) for the didactic undertones of Machaut's *Remede,* particularly regarding medieval rhetoric. Leach (2011, 139--64) provides an excellent summary of the *Remede* and analysis of its lyric interpolations in the context of the poetic functions of Hope and Desire. Boulton (1993, 188--92) defines various functions of lyric insertions into medieval French literary works, including Machaut's *Remede*.

footnote_15: >
  According to Peraino (2011, 285), "There we see the singer Machaut hand in hand with women in the dance. His voice in the *virelai* enables the carole." See also Leach (2011, 159) on Machaut's identity in this song and its depiction. Leo (2005, 66--68) explores iconographic relationships between Machaut's manuscripts and those of *Le* *Roman de la Rose,* including scenes of caroling in the *Remede.* Straple-Sovers (2023, 597) cautions that we not read too much into medieval illustrations of dance, "since these sources were not created with the intent to accurately record physical movements, relationships of dancers to one another, or their movement through space." The Machaut manuscripts are artistic objects formed in a tradition of presentation copies, in other words, and not photographic representations of actual practice.

footnote_16: >
  My transcriptions of Machaut are based upon Ludwig (1926) unless otherwise noted, differing sometimes in suggested ficta and barline placement. In the case of "Dame, a vous sans retollir," I prefer the anacrustic transcription of Maw (2002, 82) for its benefit of situating the cadences on downbeats, contra Ludwig and Schrade. My beats 1 and 2 correspond Earp's (1991, 129) "metrical units" 1 and 2, adjusted for the anacrusis. Earp (2005, 106--7) uses the same song as an example of conventional text declamation. His bold-numbered syllables correspond to my numbered beats 1 and 2.

footnote_17: >
  For Earp (1991, 138), "Machaut's early dance virelais . . . are already far more refined than a popular dance song."

footnote_18: >
  Cadence here refers to arrival on a pitch stressed by alignment with the end of a poetic line, agogic accent, being followed by a rest, modal relationship to the last note of the song, and perfect consonance with other voices in polyphonic cases. Moll (1998, 32) defines cadence accordingly for fourteenth-century French masses.

footnote_19: >
  Machaut's virelais are numbered as in the editions of Ludwig and Schrade, separated by a slash when Ludwig/Schrade begin to diverge at V23/21.

footnote_20: >
  The B sections in some of Machaut's longer virelais have paired open/closed endings in which the second ending, that which closes the B section, does end on the final. The same open/closed tonal relationship plays out across the A and B sections of V2, rather than within the B section itself.

footnote_21: >
  This weak-beat F is further attenuated by the poetic declamation, as the penultimate syllable of "re-TRAI-re" is stressed (beat 1) and the final syllable unstressed (beat 2).

footnote_22: >
  Following Earp (1991, 130), "There are no extended melismas, and thus the ear hears the text syllables themselves as providing the musical rhythms." The syncopated "pitch accents" marked in Maw (2002, 72, example 1) occasionally insinuate a perfect minor grouping that rubs against the prevailing imperfect major metrical and declamatory accents of "He! Dame de vaillance" (V1). Maw (2002, 91, example 14c) explicitly renotates "Helas! et comment" (V18) along the same lines, switching to 3/4 to capture the grouping change. Maw (2013, 397, example 8) likewise transcribes the same V18 in 6/8 (mm. 1--6) then 3/4 (mm. 7--11) based upon the syllabification of those phrases. Peraino (2011, 242) mentions a similar "metrical ambiguity (toggling between 6/8 and 3/4)" in Machaut's "Dame, a vous sans retollir," examined above, without further specification. Leguy's edition (from Mach G) is particularly distinct from Ludwig and Schrade in its flexible approach to metric grouping, freely beaming groups of twos and threes in order to capture different "rhythmic cells" (see foreword, vi). V14 is one of ten virelais to which she assigns the dual time signatures 6/8 and 3/4, in addition to others with multiple time signatures.

footnote_23: >
  On equating various rhythmic groupings, the *Quatour principalia* (mid-fourteenth century) is particularly clear. See the translation in Aluas (1996, 685).

footnote_24: >
  Earp (2005, 2012) documents the conventional relationship between metrical pulses and rate of text declamation in Machaut, regarding irregularity ("declamatory dissonance") as a strategy of poetic expression.

footnote_25: >
  This dorian pentachordal descent is balanced either by the dorian tetrachordal descent D--A described above (mm. 1--5) or by the pentachordal descent E--A defined by the poetic line breaks, in the latter case linking the two locations of dorian pentachord.

footnote_26: >
  My use of the open bracket is adapted from the modern transcription of medieval coloration, in which a change of ink color or style of notehead in a source manuscript indicates a change of mensural reckoning. Open brackets in modern transcription are distinguished from closed brackets, which usually represent ligated neumes that convey the rhythmic values of a set of pitches.

footnote_27: >
  Besides its triple meter, this virelai is also atypical in being polyphonic. The inclusion of counterpoint likely represents further evolution beyond the genre's practical dance origins.

footnote_28: >
  These are highlights of a larger tonal arch fashioned by the poetry's line lengths. Set in groups of 7 and 4 syllables, as marked with vertical strokes in the example, the lyric endings define an orderly plan initially rising in fifths F--C--G (mm. 4, 8, 10), pausing on G (m. 14) as an open neighbor to final F, then descending back through fifths G--C--F to close (mm. 16, 20, 22).

footnote_29: >
  Maw (2013) provides a thorough analysis of text setting in the Machaut sources, including the alignment of lyric and metric stress, and reconstructs some principles for fitting words to music in his songs.

footnote_30: >
  My transcription of V20 conforms with all but one Machaut manuscript in which this song is represented (Mach B, C, E, G, and Vg). It differs from Mach A, which appends a breve (half) rest after the *ouvert* cadence on A in m. 11. If this rest is a measured duration and not merely a section marker, it represents a significant metrical change insofar as it provides a new measure for another *modus* beat. This extra measure would realign the repeat of the refrain on the same metrical footing---that is, m. 1 would return on beat 1 as before---correcting what I characterized as a mismatch. However, I take this phantom breve to be a section marker, because it is not present when the refrain is renotated with new text later in Mach A (after "oubli," not shown in the example).

footnote_31: >
  My transcription follows Schrade (1956) in maintaining duple time throughout; Ludwig (1926), by contrast, alternates 2/4 frequently with quadruple time (notated 4/4) and includes a single measure of 3/2.

footnote_32: >
  From the virelais alone, see examples of this motive in V5 (mm. 4--5), V6 (mm. 15--16), V10 (mm. 14--15), V11 (mm. 4--5, 10--11, and 14--15), V12 (mm. 8--11 and 18--21, second endings), V15 (m. 18), V17 (mm. 8--9), V18 (mm. 9--10), V23/21 (m. 9), V26/23 (mm. 12--14), V29/26 (mm. 4--5), V31/28 (mm. 14--16, 25--26, and 31--32), and V37/31 (mm. 10--11 and 19--20), not to mention the innumerable variants of this pattern.

footnote_33: >
  While emphasis of the pitch C enjoys a modal rationale here, the modern analyst of medieval music must always beware the pitfalls of creating the tonal emphases they wish to find through the creative act of transcription, such as the metrical fitting of barlines and deploying of *musica ficta* as leading tones*.* Leach (2000, 45--46) reviews these issues in reference to fourteenth-century song. As speculated upon later in this study, dance provides another parameter of medieval performance that may regulate meter---and thus tempt the modern analyst into placing this or that note on or off the beat. *Caveat saltator.*

footnote_34: >
  The tonal closure achieved only upon the repeat of phrase β (mm. 24--28) could have been achieved the first time (m. 22) by simply landing on F (\^1) instead of on E (\^7). The necessity of the repeat, in that case, may be attributable to text painting. Throughout the poem Machaut's protagonist scorns despair and, in mm. 18--22, dwells willfully upon happy thoughts across an extraordinary melisma of four measures. If the rate of text declamation here paralleled the first phrase β instead (mm. 6--12), the appendage of a third phrase β would be superfluous.

footnote_35: >
  Lerdahl and Jackendoff (1983, 19) associate undifferentiated beats with strong-weak alternation, so that beats 1 and 3 of 4/4 meter are strong while 2 and 4 are weak. In the transcription of Machaut's virelais here, this corresponds to two measures of imperfect *tempus* counted 1 2 / 1 2. Counting mensural units at the *modus* level reveals the first beat 1 to be stronger than the second---parallel to beat 1's comparative strength over beat 3---because it is also strong at the *modus* level while the second *tempus* beat 1 falls under a weak beat in *modus* reckoning*.* See also Lerdahl and Jackendoff (1983, 18--30) on metrical hierarchy. Boone (2000, 4) presents a similar "grid of pulse classes and pulse levels" in a medieval repertory.

footnote_36: >
  On flexible metrical grouping as a valued characteristic of deep mensural levels in Machaut, see Boone (2000), Maw (2004), and Lavacek (2022). The flexible metrical interpretations of *modus* and *maximodus* here resonate with Lerdahl and Jackendoff (1983, 22): "This large level of metrical analysis \[at 4 bars\] is open to interpretation, whereas smaller levels are not."

footnote_37: >
  Other modern scholars have noted how broadening the mensuration can realize a *ritardando* effect before a cadence. Adjusting *modus* and larger mensural groupings to align harmonic units and cadences is central to the analysis of Machaut's motets in Lavacek (2022). Kohn (1981, 41--42) comments upon a cadential retardation effected through mixed meters in the Dunstable motet "Sancta Maria." Desmond (2018, 217) shows a change in all voices from imperfect to perfect *modus,* which acts like a cadential retardation, at the conclusion of each *talea* of the *Fauvel* motet "Garrit/In nova." Maw (2004, esp. 64--65) locates *modus* perfections in an imperfect context leading up to cadences in Machaut's ballade "Gais et jolis" (B35), among other examples. He later calls this effect "a reverse hemiola at the cadence" (86). Further examples from Machaut's virelais are found in Maw (2002, 84).

footnote_38: >
  By interpreting perfections at the *modus* level, I achieve the same effect as Ludwig's single bar of 3/2 (breves 22--24), with the benefit of placing the final F on a downbeat (breve 27).

footnote_39: >
  My discant reduction was largely produced by the simple omission of dissonances against the tenor, especially when such notes occur off the beat in passing or neighboring melodic motion. Leach (2000) provides an instructive example of modern reductive analysis grounded in medieval theory.

footnote_40: >
  On the crucial concept of directed progressions in fourteenth-century polyphony, the classic source is Fuller (1992). Essentially, imperfect consonances drive toward the greater stability of perfect consonances through stepwise contrary motion, especially M3🡪P5, M6🡪P8, and m3🡪P1. As a foundation for Machaut's *ars nova* practice, polyphonic simultaneity is tightly linked to consonance/dissonance placement in the *ars antiqua* mensural theories of John Garland, Franco of Cologne, and Anonymous IV, as detailed in Fuller (1981).

footnote_41: >
  In Machaut's polyphonic chansons, a free tenor voice is composed against the fundamental cantus, the reverse of his sacred cantus firmus style.

footnote_42: >
  The modern formulation of the directed progression, stepwise contrary motion from imperfect to perfect consonance, was introduced in Fuller 1986 and further developed in Fuller 1992.

footnote_43: >
  Insofar as Mullally (1998, 19) insists that "social dance of the period requires music in duple time," these few songs in triple time may be further evidence of Machaut's artistic extension of a genre with ancestry in dance.

footnote_44: >
  Maw (2004, 94--95, table 7) provides a detailed list of *modus* organization in Machaut's *formes fixes*, including flexible readings of perfect/imperfect alternation.

footnote_45: >
  For a rich and broad exploration of dance's artistic, political, and intellectual importance to western European society during 1250--1750, see Nevile (2008a, 2008b). Renberg (2022) recounts the falling status of dance in early medieval texts from worshipful to sinful (as gendered bodies in motion), while Dickason (2021) explores the reclamation of dance from a transgression to an integral part of medieval religious practice. Chaganti (2018) details how the central position of dance in late medieval society informed the creation and reception of lyric poetry. Page (1989, 110--33) views the French *carole*'s social context from the perspective of an evolving clergy. Straple-Sovers (2023) is instructive on the challenges and authenticity of recreating medieval dance practice, given the dearth of sources; see also Straple-Sovers (2021) on reading bodily movement---with caroling as cautionary example---in medieval literature. Arcangeli (1994) reviews the colorful denunciation of dance by medieval clergy and moralists, not limited to claims of adultery, gluttony, paganism, lechery, and disregard for the Sabbath.

footnote_46: >
  Also *karole* and *querole.* Latin: *chorea*. The term refers both to the dance itself and to the music that accompanied dancing. McGee (2012, 399) notes that "scholars in all fields use the term \[*carole*\] with a vague and sometimes contradictory understanding of exactly to what it refers." Stevens (1986, 175) calls the *carole* "a dance-idea waiting to be realized in various forms." Dickason (2021, 5) points to the array of activities inseparably connoted by Latin terms for dancing, including not only bodily movement but also singing and exalting God. Mullally (2011) discusses the etymology, choreography, and social participation of this simple dance without detailed analysis of musical structure. In a highly critical review, McGee (2012) casts doubt on Mullally's dismissal of commonly accepted views of caroling, his biased selection and weighing of evidence on the dance and its accompanying music, and his specific application of the hypothetical dance steps he posits for the *carole*.

footnote_47: >
  Ward (1976) and Dean Smith (1937) provide accounts of a fifteenth-century handbook on the *basse danse* that introduces step patterns. Little (1975) discusses a Baroque dance manual more closely matched to the given music, including implications for analysis and musical performance.

footnote_48: >
  Rimmer (1985) makes a speculative attempt to match specific dance step patterns with medieval trouvère repertory. Her choreography rests upon the anachronistic assumption that the steps of fifteenth-century *branles* can be applied to "chain and round dances \[*caroles*\] of which we know practically nothing" yet which are presumed to have "identical step elements" (26).

footnote_49: >
  That rest is a transcription of the semibreve rest in all sources (Mach A, C, G, and Vg), omitted by Ludwig (1926) and restored by Schrade (1956). V14 joins V4, V27/24, and V36/30 to form a small set of virelais that begin with a semibreve rest in all manuscripts. Ludwig (1926) reproduces the rest only in V27/24, likely to counterpoint the tenor's entrance, whereas Schrade (1956) begins both V27/24 and V36/30 (both polyphonic) with a beat of rest, but not V4 (monophonic).

footnote_50: >
  Little (1975, 114, 119) discusses a French Baroque dance manual, one of the first to inlay music notation with dance steps, in which pickup notes are danced with an introductory plié before the steps proper begin.

footnote_51: >
  Excepting Mach E's of notation of V28/25, which begins on the sung pickup note itself without preparatory rests to begin dancing.

footnote_52: >
  Ludwig (1926) represents none of these rests, whereas Schrade (1956) restores them all.

footnote_53: >
  Concerning mensural notation in the *ars nova*, Jacques de Liège (1320s) observes that "the perfect breve has the same value as had the perfect long for the Ancients," with consequences for modern transcription; see Maw (2004, 47).

footnote_54: >
  When Chaganti (2018, 17) notes that "Machaut and Deschamps wrote lyrics that were mindful of the aesthetics of dance and dance accompaniment," this does not mean that these lyrics were necessarily danced, but rather that they embrace certain markers of that tradition, analogous to a bourrée by Bach or, still further removed, the ballades of Chopin.

